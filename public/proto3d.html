<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D engine demo — duel board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&amp;family=Barlow+Semi+Condensed:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1219; }
  body { font-family: 'Barlow Semi Condensed', sans-serif; color: #efe6d5; }
  #canvasWrap { position: absolute; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: fixed; left: 14px; top: 14px; z-index: 10; max-width: 320px;
    font-size: 13px; line-height: 1.5;
    background: rgba(11,18,25,0.78); border: 1px solid rgba(239,230,213,0.14);
    border-radius: 4px; padding: 10px 14px;
  }
  #hud b { color: #d9a441; }
  #stats {
    position: fixed; right: 14px; top: 14px; z-index: 10;
    background: rgba(11,18,25,0.78); border: 1px solid rgba(239,230,213,0.14);
    border-radius: 4px; padding: 10px 14px; font-size: 13px; text-align: right;
  }
  #panel {
    position: fixed; right: 14px; bottom: 14px; z-index: 10; width: 220px;
    background: rgba(11,18,25,0.86); border: 1px solid rgba(239,230,213,0.14);
    border-radius: 4px; padding: 12px 14px; font-size: 13px;
  }
  #panel h3 { margin: 0 0 8px; font-family: 'Bitter', serif; font-size: 15px; }
  #panel button {
    width: 100%; margin-top: 6px; padding: 7px; border-radius: 3px; cursor: pointer;
    background: rgba(239,230,213,0.08); border: 1px solid rgba(239,230,213,0.22);
    color: #efe6d5; font-family: inherit; font-size: 12.5px;
  }
  #panel button:hover { background: rgba(217,164,65,0.18); border-color: #d9a441; }
  #panel button:disabled { opacity: 0.35; cursor: default; }
  #panel .row { display: flex; justify-content: space-between; margin: 3px 0; color: #9aa1a8; }
  #panel .row b { color: #efe6d5; font-weight: 600; }

  .fp3d-label {
    font: 600 12px 'Barlow Semi Condensed', sans-serif; color: #efe6d5;
    background: rgba(11,18,25,0.78); padding: 2px 6px; border-radius: 2px;
    transform: translate(-50%, -100%); white-space: nowrap;
  }
  .fp3d-troop { transform: translate(-50%, -140%); }
  .fp3d-march { font: 600 13px 'Barlow Semi Condensed', sans-serif; color: #d9a441; background: rgba(11,18,25,0.86); padding: 4px 10px; border-radius: 3px; transform: translate(-50%, -100%); white-space: nowrap; }
</style>
</head>
<body>

<div id="hud">
  <b>3D engine demo</b> — real local match, real AI opponent, free camera.<br>
  Drag your own garrison to march it (shift = send all) · orbit/pan/zoom same as before.<br>
  Not wired into the real game yet — Phase 2a spike.
</div>
<div id="stats">
  <div>tick <span id="tickVal">0</span></div>
  <div>money <span id="moneyVal">0</span></div>
</div>
<div id="panel" style="display:none">
  <h3 id="panelTitle">—</h3>
  <div class="row"><span>Owner</span><b id="panelOwner">—</b></div>
  <div class="row"><span>Garrison</span><b id="panelGarrison">—</b></div>
  <button id="buildBarracks">Build Barracks</button>
  <button id="buildIndustry">Build Industry</button>
</div>

<div id="canvasWrap"><canvas id="cv"></canvas></div>

<script src="./map.js"></script>
<script src="./sim.js"></script>
<script src="./ai.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import { create } from './board-render-3d.js';

const params = new URLSearchParams(location.search);
const boardKey = params.get('board') === 'grand' ? 'grand' : 'duel';
const AI_LEVEL = 'Steady';
const HUMAN_SEAT = 0;

const F = self.FPMap, S = self.FPSim, AI = self.FPAI;
const M = F.build(boardKey);
const sim = S.create(M);
const matchStartMs = Date.now();

const cv = document.getElementById('cv');
const R3D = create(cv, M);

// ── input state ──────────────────────────────────────────────────────────
const ui = { sel: null, dragFrom: null, dragTo: null, dragging: false, path: null };

function tileKeyOf(t) { return F.tileKey(t.c, t.r); }

cv.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  const rect = cv.getBoundingClientRect();
  const t = R3D.tileAt(e.clientX - rect.left, e.clientY - rect.top);
  if (!t) return;
  const k = tileKeyOf(t);
  const mine = (sim.owners[k] ?? null) === HUMAN_SEAT;
  ui.sel = t;
  if (mine && (sim.garrisons[k] || 0) > 0) {
    ui.dragFrom = t; ui.dragging = true; ui.dragTo = null; ui.path = null;
    R3D.controls.enabled = false; // OrbitControls listens on the same canvas — without this, a march-drag also orbits the camera
  }
  renderPanel();
});

addEventListener('mousemove', e => {
  if (!ui.dragging) return;
  const rect = cv.getBoundingClientRect();
  const t = R3D.tileAt(e.clientX - rect.left, e.clientY - rect.top);
  ui.dragTo = t;
  ui.path = (t && (t.c !== ui.dragFrom.c || t.r !== ui.dragFrom.r))
    ? F.travelPath(M, [ui.dragFrom.c, ui.dragFrom.r], [t.c, t.r], S.RULES.hopTicks, S.RULES.offRoadTicks)
    : null;
});

addEventListener('mouseup', e => {
  if (!ui.dragging) return;
  if (ui.dragTo && ui.path && ui.path.length && (ui.dragTo.c !== ui.dragFrom.c || ui.dragTo.r !== ui.dragFrom.r)) {
    const pct = e.shiftKey ? 100 : 50;
    S.march(sim, M, HUMAN_SEAT, [ui.dragFrom.c, ui.dragFrom.r], [ui.dragTo.c, ui.dragTo.r], pct);
  }
  ui.dragging = false; ui.dragFrom = null; ui.dragTo = null; ui.path = null;
  R3D.controls.enabled = true;
});

document.getElementById('buildBarracks').addEventListener('click', () => {
  if (ui.sel) S.build(sim, M, HUMAN_SEAT, ui.sel.c, ui.sel.r);
});
document.getElementById('buildIndustry').addEventListener('click', () => {
  if (ui.sel) S.industry(sim, M, HUMAN_SEAT, ui.sel.c, ui.sel.r);
});

function renderPanel() {
  const panel = document.getElementById('panel');
  if (!ui.sel) { panel.style.display = 'none'; return; }
  panel.style.display = 'block';
  const k = tileKeyOf(ui.sel);
  const p = F.territoryAt(M, ui.sel.c, ui.sel.r);
  const owner = sim.owners[k] ?? null;
  document.getElementById('panelTitle').textContent = p ? p.name : '—';
  document.getElementById('panelOwner').textContent = owner === null ? 'Neutral' : `Seat ${owner}`;
  document.getElementById('panelGarrison').textContent = String(sim.garrisons[k] || 0);
  const mine = owner === HUMAN_SEAT;
  document.getElementById('buildBarracks').disabled = !mine;
  document.getElementById('buildIndustry').disabled = !mine;
}

// ── tick loop — same cadence/shape as game.html's local (non-networked)
// startLoop(), minus prediction/networking, since this demo has neither. ──
const dt = 1000 / S.RULES.tickHz;
setInterval(() => {
  if (sim.over !== null) return;
  const owed = Math.floor((Date.now() - matchStartMs) / dt) - sim.tick;
  let ran = 0;
  while (ran < owed && ran < 40 && sim.over === null) {
    S.step(sim, M);
    if (AI_LEVEL !== 'None') AI.think(sim, M, 1 - HUMAN_SEAT, AI_LEVEL);
    ran++;
  }
  if (ran) {
    document.getElementById('tickVal').textContent = String(sim.tick);
    document.getElementById('moneyVal').textContent = String(Math.floor((sim.money[HUMAN_SEAT] || 0) / 1000));
    if (ui.sel) renderPanel(); // garrison count under the panel changes every tick
  }
}, dt);

// ── render loop ──────────────────────────────────────────────────────────
addEventListener('resize', () => R3D.resize());

let marchLabelText = '';
function frame() {
  requestAnimationFrame(frame);
  R3D.controls.update();

  if (ui.dragging && ui.path && ui.path.length) {
    const k = tileKeyOf(ui.dragFrom);
    const send = Math.floor((sim.garrisons[k] || 0) * (self._shiftHeld ? 100 : 50) / 100);
    const ticks = ui.path.reduce((n, [c, r]) => n + S.hopCost(M, c, r), 0);
    marchLabelText = `${send} · ${(ticks / S.RULES.tickHz).toFixed(1)}s`;
  }

  R3D.update({
    owners: sim.owners, garrisons: sim.garrisons, barracks: sim.barracks, industry: sim.industry,
    stacks: sim.stacks, stackAt: st => S.stackAt(sim, st, M),
    sel: ui.sel, armed: ui.dragging ? ui.dragFrom : null,
    marchPath: ui.dragging ? ui.path : null,
    marchLabelText: ui.dragging ? marchLabelText : null,
  });

  R3D.renderer.render(R3D.scene, R3D.camera);
  R3D.cssRenderer.render(R3D.scene, R3D.camera);
}
frame();
</script>
</body>
</html>
