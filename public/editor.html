<!DOCTYPE html>
<html data-faction="cobalt-ember">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supremacy Live — Map Editor</title>
<link rel="stylesheet" href="./tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow+Semi+Condensed:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<script src="./map.js"></script>
<script src="./board-render.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
  import * as THREE from 'three';
  import { CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
  import { create } from './board-render-3d.js';
  self.FPRender3D = { create };
  // Exposed so the classic <script> below can build its own editor-only grow-
  // handle meshes directly in board-render-3d.js's scene (see syncGrowHandles3D())
  // without board-render-3d.js itself needing to know about grid-growth UI —
  // that module is shared with game.html, which has no use for it.
  self.THREE = THREE;
  self.CSS2DObject = CSS2DObject;
  self.dispatchEvent(new Event('fp-render-3d-ready'));
</script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; overflow: hidden;
    background: var(--sl-ink-100); color: var(--sl-text);
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-variant-numeric: tabular-nums;
  }
  h1, h2, h3 { font-family: var(--sl-font-display); font-weight: var(--sl-fw-display); text-transform: uppercase; letter-spacing: var(--sl-tr-display); margin: 0; }
  input, select, button { font-family: inherit; }
  a { color: var(--sl-signal); }
  ::selection { background: var(--sl-signal-glow); }
  /* Chrome, not document text — painting/dragging on the board shouldn't be
     able to kick off a text-selection drag on adjacent panel labels. */
  * { -webkit-user-select: none; user-select: none; }
  input, textarea { -webkit-user-select: text; user-select: text; }

  #app { display: none; height: 100vh; flex-direction: column; }
  #app.ready { display: flex; }

  #topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 18px; border-bottom: 1px solid var(--sl-seam-strong);
    background: var(--sl-ink-200);
  }
  #topbar h1 { font-size: var(--sl-fs-ui-md); font-weight: 700; color: var(--sl-text); }
  #topbar .sub { font-size: var(--sl-fs-label); color: var(--sl-text-mute); }
  #topbar .spacer { flex: 1; }
  #saveStatus { font-size: var(--sl-fs-label); color: var(--sl-text-dim); min-width: 160px; text-align: right; }
  #saveStatus.err { color: var(--sl-danger); }
  #saveStatus.ok { color: var(--sl-ok); }

  button.btn {
    padding: 8px 16px; cursor: pointer;
    background: var(--sl-seam); border: 1px solid var(--sl-seam-strong);
    color: var(--sl-text-dim); font-size: var(--sl-fs-ui-xs);
  }
  button.btn:hover { color: var(--sl-signal-hot); border-color: var(--sl-seam-signal); }
  button.btn:disabled { opacity: 0.4; cursor: default; }
  button.btn.primary { background: var(--sl-signal); border-color: var(--sl-signal); color: var(--sl-text-invert); font-weight: 600; }
  button.btn.primary:hover { background: var(--sl-signal-hot); border-color: var(--sl-signal-hot); }
  button.btn.on { background: var(--sl-signal-wash); border-color: var(--sl-signal); color: var(--sl-text); }
  button.btn.danger { border-color: var(--sl-danger); color: var(--sl-danger); }
  button.btn.danger:hover { filter: brightness(1.15); }

  #main { flex: 1; display: flex; min-height: 0; }
  #canvasWrap { flex: 1; position: relative; background: var(--sl-ink-100); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hint {
    position: absolute; left: 14px; bottom: 12px; padding: 7px 12px;
    background: color-mix(in srgb, var(--sl-ink-100) 76%, transparent); border: 1px solid var(--sl-seam-strong);
    font-size: var(--sl-fs-label); color: var(--sl-text-mute);
  }

  #panel {
    width: 320px; flex: none; overflow-y: auto; overflow-x: hidden;
    border-left: 1px solid var(--sl-seam-strong); background: var(--sl-ink-200);
    padding: 16px; display: flex; flex-direction: column; gap: 18px;
  }
  .section-title {
    font-size: var(--sl-fs-label); letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--sl-text-dim); margin-bottom: 8px;
  }
  .field { display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
  .field label { font-size: var(--sl-fs-label); letter-spacing: 0.08em; text-transform: uppercase; color: var(--sl-text-dim); }
  .field input, .field select {
    width: 100%; min-width: 0;
    padding: 7px 9px; background: var(--sl-ink-300);
    border: 1px solid var(--sl-seam-strong); 
    color: var(--sl-text); font-size: var(--sl-fs-ui-sm);
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; min-width: 0; }
  .row2 .field { min-width: 0; }
  .prov-row {
    display: flex; align-items: center; gap: 8px; padding: 6px 0;
    border-bottom: 1px solid var(--sl-seam);
  }
  .prov-row .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .prov-row input {
    flex: 1; background: transparent; border: none; border-bottom: 1px solid transparent;
    color: var(--sl-text); font-size: var(--sl-fs-ui-xs); padding: 3px 2px;
  }
  .prov-row input:focus { outline: none; border-bottom-color: var(--sl-signal); }
  .prov-row select {
    flex: none; background: var(--sl-ink-300); border: 1px solid var(--sl-seam-strong);
    color: var(--sl-text); font-size: var(--sl-fs-ui-xs); font-family: var(--sl-font-ui); padding: 3px 4px;
  }

  #symList { display: flex; flex-direction: column; gap: 6px; }
  .sym-ok { color: var(--sl-ok); font-size: var(--sl-fs-ui-xs); }
  .sym-issue {
    font-size: var(--sl-fs-ui-xs); color: var(--sl-warn); background: var(--sl-warn-wash);
    border: 1px solid var(--sl-warn); padding: 6px 8px;
  }

  #emptyPanel { font-size: var(--sl-fs-ui-xs); color: var(--sl-text-mute); line-height: 1.5; }
  .mono { font-family: var(--sl-font-mono); }

  /* CSS2DObject label styling for the 3D view — board-render-3d.js only sets
   * classNames (fp3d-label always, plus a specific one per label kind), never
   * inline style, so each page that hosts the 3D scene owns its own look.
   * game.html defines these for match labels; editor.html didn't define any
   * of them at all until the grid-reference labels below needed one — meaning
   * garrison counts here were rendering with no font/colour/background,
   * relying on the page's dark color-scheme to make default black text
   * readable by accident. Matches game.html's `.fp3d-label` rule so a number
   * looks the same whether it's a live match or the editor's preview. */
  .fp3d-label {
    font-family: var(--sl-font-mono); font-weight: var(--sl-fw-mono); font-size: var(--sl-fs-label);
    color: var(--sl-text); background: color-mix(in srgb, var(--sl-ink-100) 78%, transparent);
    padding: 2px 6px; white-space: nowrap;
  }
  /* Grid-reference axis labels (column letters / row numbers) — a reference
   * aid, not gameplay content, so no background plate and a dimmer, smaller
   * mono numeral than a garrison count gets. */
  .fp3d-gridref {
    font-family: var(--sl-font-mono); font-size: var(--sl-fs-label-sm); color: var(--sl-text-dim);
  }
  /* The "+" over an editor-only grid-growth handle (see syncGrowHandles3D()) —
   * sized like a display glyph so it reads from an orbited-out camera, not a
   * label styled for reading up close the way a garrison count is. */
  .fp3d-growplus {
    font-family: var(--sl-font-display); font-weight: var(--sl-fw-display);
    font-size: var(--sl-fs-d4); color: var(--sl-text-dim);
  }

  #login {
    height: 100vh; display: grid; place-items: center;
  }
  #login form {
    width: 300px; display: flex; flex-direction: column; gap: 12px;
    padding: 24px; border: 1px solid var(--sl-seam-strong); 
    background: var(--sl-ink-200);
  }
  #login .err { font-size: var(--sl-fs-ui-xs); color: var(--sl-danger); min-height: 16px; }
</style>
</head>
<body>

<div id="login">
  <form id="loginForm">
    <h2 style="font-size: var(--sl-fs-d4); color: var(--sl-text);">Map Editor</h2>
    <div class="field"><label>Username or email</label><input id="loginId" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="loginPw" type="password" autocomplete="current-password"></div>
    <div class="err" id="loginErr"></div>
    <button class="btn primary" type="submit">Log in</button>
  </form>
</div>

<div id="app">
  <div id="topbar">
    <h1>Map Editor</h1>
    <span class="sub" id="whoami"></span>
    <span class="sub">·</span>
    <span class="sub">duel</span>
    <div class="spacer"></div>
    <button class="btn" id="mode2dBtn">2D</button>
    <button class="btn" id="mode3dBtn">3D</button>
    <span id="saveStatus"></span>
    <button class="btn" id="reloadBtn">Reload</button>
    <button class="btn primary" id="saveBtn">Save</button>
  </div>
  <div id="main">
    <div id="canvasWrap">
      <canvas id="cv"></canvas>
      <canvas id="cv3d" style="display: none;"></canvas>
      <div id="hint">Click any tile to inspect it · Add City / Industry / Barracks, then click a valid tile to place · click + beside a sector to grow into it · scroll to zoom · drag to pan / orbit</div>
    </div>
    <div id="panel"></div>
  </div>
</div>

<script>
(function () {
  const F = () => self.FPMap;
  const R = () => self.FPRender;

  const S = {
    user: null,
    key: 'duel',
    def: null,        // raw definition, mutated in place then rebuilt
    built: null,
    symmetry: null,
    capitalIssues: null, // provinces missing (or duplicating) a capital — see rebuild()
    sel: null,         // { kind: 'tile', c, r } — every click inspects the exact tile, whatever's on it
    placeMode: null,   // null | 'city' | 'industry' | 'barracks' — active placement tool
    confirmRemove: null, // province id currently armed for a two-click "remove territory" — see select()
    confirmClearBoard: false, // armed for a two-click "clear board" — see select()
    boardError: null, // inline board-resize rejection message — see resizeSlots()
    cam: { zoom: 1, panX: 0, panY: 0 },
    saving: false,
    dirty: false,
    // The 3D renderer is the standard going forward (see docs/RENDERING.md) —
    // this toggle lets the editor preview and edit through it directly rather
    // than staying 2D-only. Shares the same localStorage key game.html/
    // index.html use for their own render-mode preference, so a choice made
    // in one place is respected in the other.
    renderMode: (() => { try { return self.localStorage.getItem('sl_render_mode') === '3d' ? '3d' : '2d'; } catch (_) { return '2d'; } })(),
  };

  const cv = document.getElementById('cv');
  const cv3d = document.getElementById('cv3d');
  const panel = document.getElementById('panel');
  const saveStatus = document.getElementById('saveStatus');
  const mode2dBtn = document.getElementById('mode2dBtn');
  const mode3dBtn = document.getElementById('mode3dBtn');

  // Placement tools offered in the panel — 'city' is its own thing (name,
  // wealth, seat/garrison), the rest come straight off FPMap.AUTHORABLE_KINDS
  // so a future structure kind (naval base, silo, airbase, ...) only needs a
  // STRUCTURE_KIT entry in map.js, not a new button wired up here.
  const PLACE_KINDS = [['city', 'Add City'],
    ...F().AUTHORABLE_KINDS.map(k => [k, 'Add ' + F().STRUCTURE_KIT[k].label])];

  // Upper bound on the slot grid in either axis — shared by resizeSlots()
  // (typed input) and growHandles() (on-canvas + affordance) so the two grow
  // paths agree on when the board is "full" without duplicating the number.
  const MAX_SLOTS = 12;

  // ── auth ───────────────────────────────────────────────────────────────
  async function me() {
    const r = await fetch('/api/auth/me', { credentials: 'same-origin' });
    const j = await r.json().catch(() => ({ user: null }));
    return j.user || null;
  }

  document.getElementById('loginForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    const identifier = document.getElementById('loginId').value.trim();
    const password = document.getElementById('loginPw').value;
    const errEl = document.getElementById('loginErr');
    errEl.textContent = '';
    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ identifier, password }),
      });
      const j = await r.json();
      if (!r.ok || !j.ok) { errEl.textContent = (j && j.error) || 'login failed'; return; }
      boot(j.user);
    } catch (_) { errEl.textContent = 'network error'; }
  });

  // ── load ───────────────────────────────────────────────────────────────
  async function loadMap() {
    const r = await fetch('/api/maps/' + S.key, { credentials: 'same-origin' });
    const j = await r.json().catch(() => null);
    if (!r.ok || !j || !j.ok) throw new Error((j && j.error) || 'failed to load map');
    S.def = j.map.definition;
    S.dirty = false;
    // A (re)load may bring in a differently-sized board — the 3D scene's
    // land/water instance counts and structure meshes are sized to whatever
    // board create() last saw, so a stale scene can't just be updated in
    // place the way an in-place edit can. Cheap to rebuild from scratch here;
    // this is editor-only, not the live match render loop.
    reset3D();
    rebuild();
  }

  function rebuild() {
    S.built = F().build(S.def);
    S.symmetry = S.key === 'duel' ? F().symmetry(S.built) : { ok: true, issues: [] };
    // A sector's capital is now an explicit flag on a city (see map.js's
    // capitalOf()), not a board position, so it's easy to lose track of
    // mid-edit — deleting a city, or un-marking one, can leave a sector with
    // none. Surfaced live here (unlike symmetry, checked on every board, not
    // just duel) so that's visible before Save ever gets clicked and rejects
    // it — see handlePutMap's matching, save-blocking check in worker.js.
    S.capitalIssues = F().capitalIssues(S.built);
    S.boardError = null; // any successful edit supersedes a stale board-resize error
    renderPanel();
    paint();
  }

  async function boot(user) {
    S.user = user;
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').classList.add('ready');
    document.getElementById('whoami').textContent = user.username;
    try {
      await loadMap();
    } catch (err) {
      saveStatus.textContent = String(err.message || err);
      saveStatus.className = 'err';
    }
  }

  me().then(user => {
    if (user) boot(user);
    else document.getElementById('login').style.display = 'grid';
  });

  // ── camera / render ───────────────────────────────────────────────────
  function buildCam(W, H) {
    return F().orbitCamera(S.built, W, H, {
      yaw: F().BASE_YAW, pitch: F().BASE_PITCH,
      zoom: S.cam.zoom, panX: S.cam.panX, panY: S.cam.panY,
      bearings: [F().BASE_YAW],
      insets: { top: 24, right: 24, bottom: 24, left: 24 },
    });
  }

  // Seat colours read once from the design-system tokens — the 2D renderer
  // does this lazily itself (board-render.js's own tokens()), but the 3D
  // overlay below needs a seatColour callback handed to it explicitly, the
  // same way game.html supplies one to board-render-3d.js.
  let _tok = null;
  function tokens() {
    if (_tok) return _tok;
    const read = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    const faction = read('--sl-faction-self');
    // Fallbacks mirror tokens.css's own cobalt-ember defaults — same
    // reasoning as board-render.js's tokens(). Only cache once the canary
    // read is non-empty, so a call that lands before tokens.css has applied
    // still returns a valid colour (both board-render.js's shade() and
    // board-render-3d.js's toHex() require a real string, not null) without
    // permanently caching a stale fallback once the real one is available.
    const t = {
      self: faction || '#3d8fd4',
      foe: read('--sl-faction-foe') || '#e0574a',
      neutral: read('--sl-faction-neutral') || '#7d8683',
    };
    if (faction) _tok = t;
    return t;
  }
  function seatColour(seat) {
    const t = tokens();
    return seat === 0 ? t.self : seat === 1 ? t.foe : t.neutral;
  }

  /** Sparse owners/garrisons overlay built straight from the definition
   *  being edited — there is no sim here, this is content, not a game in
   *  progress. Shaped to satisfy both renderers' overlay contract
   *  (board-render.js's `board()` and board-render-3d.js's `update()` — see
   *  docs/RENDERING.md) rather than keeping two separate overlay builders:
   *  the 2D renderer simply ignores the fields it doesn't use, defaulting
   *  seatColour to its own house palette if this weren't supplied at all.
   *
   *  owners starts from seedOwners(S.built) — the exact function sim.create()
   *  itself calls at kickoff — so a sector's *whole* footprint colours the
   *  moment a starting seat is assigned to it (see setStartingSeat()), not
   *  only the single tile a city happens to occupy. This used to be built
   *  from individual cities' own `seat` fields alone, which is why only a
   *  city placed exactly on a sector's centre tile appeared to "set the
   *  whole sector's colour" — that tile is the one territoryOwner() actually
   *  checks (see map.js), so it was the only position where a city's `seat`
   *  could ever reach it. In a real match `city.seat` isn't read for
   *  ownership at all (only `sim.create()`'s `seedOwners()` is) — it's
   *  authored bookkeeping, not a second source of truth — so it's layered on
   *  *after* seedOwners() here: enough to let an individual city override a
   *  single tile if a GM wants that, never required for a sector to read as
   *  owned. */
  function overlay() {
    const owners = F().seedOwners(S.built), garrisons = {}, barracks = {}, industry = {};
    for (const c of S.built.cities) {
      const tc = Math.floor(c.tc), tr = Math.floor(c.tr);
      const k = F().tileKey(tc, tr);
      if (c.seat === 0 || c.seat === 1) owners[k] = c.seat;
      if (c.garrison) garrisons[k] = c.garrison;
    }
    for (const st of S.built.structures) {
      const k = F().tileKey(st.c, st.r);
      if (st.kind === 'barracks') barracks[k] = st.seat;
      else if (st.kind === 'industry') industry[k] = st.seat;
    }
    // Every tile selection carries {c, r} — this is what makes the 3D
    // renderer's camera lock/recentre (board-render-3d.js) engage
    // consistently no matter what's on the clicked tile, not just cities.
    const sel = S.sel ? { c: S.sel.c, r: S.sel.r } : null;
    return {
      owners, garrisons, sel, labels: true, slots: true, seatColour,
      barracks, industry, stacks: [], stackAt: () => null,
      armed: null, multi: null, marchPath: null, marchLabelText: null,
      // Editing can add/delete/move a city without a full 3D scene rebuild
      // (see reset3D()'s own comment on why territory/grid changes still
      // need one but city changes don't) — board-render-3d.js's update()
      // reads this instead of its own create()-time city list when present.
      cities: S.built.cities,
    };
  }

  let cam = null;

  // ── grid-growth handles ──────────────────────────────────────────────────
  // One phantom "+" per empty slot orthogonally adjacent to an existing
  // sector — the on-canvas alternative to typing a bigger number into the
  // Board panel's Sector cols/rows fields (still there, still the only way to
  // shrink; see resizeSlots()). Growing is per-sector, not per-axis: clicking
  // a handle places exactly one new sector at that slot (see addTerritory())
  // and nothing else — expanding right of one sector never implicitly reveals
  // a slot in some other row the GM didn't ask for. The new sector's own
  // unoccupied neighbours become handles on the next render, purely because
  // this is recomputed fresh from S.built.provinces every time — no separate
  // "which slots have been grown into" state to keep in sync. Can grow in any
  // of the four directions, including left/up (addTerritory() shifts every
  // existing province's sc/sr when a slot's coordinate would otherwise go
  // negative — slot coordinates are always non-negative, see
  // docs/MAP_SYSTEM.md), unlike the old axis-only version this replaced.
  function growHandles() {
    if (!S.built) return [];
    const cur = S.def.slots || F().DEFAULT_SLOTS;
    const block = S.built.block;
    const occupied = new Set(S.built.provinces.map(p => p.sc + ',' + p.sr));
    const frontier = new Map(); // "sc,sr" -> { sc, sr }
    const consider = (sc, sr) => {
      const key = sc + ',' + sr;
      if (occupied.has(key) || frontier.has(key)) return;
      // Would this slot still fit under MAX_SLOTS once grown (and, on the
      // low edge, shifted)? Same arithmetic as addTerritory() itself.
      const needCols = sc < 0 ? cur.cols - sc : Math.max(cur.cols, sc + 1);
      const needRows = sr < 0 ? cur.rows - sr : Math.max(cur.rows, sr + 1);
      if (needCols > MAX_SLOTS || needRows > MAX_SLOTS) return;
      frontier.set(key, { sc, sr });
    };
    if (S.built.provinces.length === 0) {
      consider(0, 0); // nothing on the board at all — bootstrap a single starting handle
    } else {
      for (const p of S.built.provinces) {
        consider(p.sc - 1, p.sr); consider(p.sc + 1, p.sr);
        consider(p.sc, p.sr - 1); consider(p.sc, p.sr + 1);
      }
    }
    return [...frontier.values()].map(({ sc, sr }) => ({
      sc, sr, c0: sc * block.w, r0: sr * block.h, w: block.w, h: block.h,
    }));
  }

  // Read once from the design tokens, same caveat/pattern as tokens() above —
  // board-render.js doesn't export its own tokens(), so a grow handle (drawn
  // by editor.html itself, not the shared renderer) needs its own small
  // achromatic read. --sl-ink-500 ("pressed: control active") reads as a
  // solid, clickable block next to the fainter dashed water placeholder;
  // --sl-seam-signal ("selected / armed / live edge") is the sanctioned edge
  // tone for a live, interactive board affordance — neither is invented here.
  let _growTok = null;
  function growTokens() {
    if (_growTok) return _growTok;
    const read = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    const fill = read('--sl-ink-500'), edge = read('--sl-seam-signal'), plus = read('--sl-text-dim');
    const t = { fill: fill || '#252f36', edge: edge || 'rgba(255,255,255,0.55)', plus: plus || '#9ba39f' };
    if (fill && edge && plus) _growTok = t;
    return t;
  }

  function drawGrowHandles2D(ctx) {
    if (!S.built || !cam) return;
    const gt = growTokens();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const g of growHandles()) {
      const a = cam.project(g.c0, g.r0), b = cam.project(g.c0 + g.w, g.r0);
      const d = cam.project(g.c0 + g.w, g.r0 + g.h), e = cam.project(g.c0, g.r0 + g.h);
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(d[0], d[1]); ctx.lineTo(e[0], e[1]);
      ctx.closePath();
      ctx.fillStyle = gt.fill; ctx.fill();
      ctx.strokeStyle = gt.edge; ctx.lineWidth = 1.4; ctx.stroke();
      const mid = cam.project(g.c0 + g.w / 2, g.r0 + g.h / 2);
      ctx.font = `600 ${Math.max(20, 1.6 * cam.scale)}px 'Barlow Condensed', sans-serif`;
      ctx.fillStyle = gt.plus;
      ctx.fillText('+', mid[0], mid[1]);
    }
  }

  // Screen px -> the { sc, sr } of the grow handle sitting under the point,
  // or null. Checked before ordinary tile hit-testing (see onClick()) since a
  // handle can sit outside S.built.gridW/gridH (or even at a negative slot
  // coordinate, on the low edge), where tileAtAny() already — and correctly,
  // for every other caller — returns null.
  function growHandleAt2D(mx, my) {
    if (!cam || !S.built) return null;
    const u = cam.unproject(mx, my);
    for (const g of growHandles()) {
      if (u.c >= g.c0 && u.c < g.c0 + g.w && u.r >= g.r0 && u.r < g.r0 + g.h) return { sc: g.sc, sr: g.sr };
    }
    return null;
  }

  function paint() { S.renderMode === '3d' ? paint3D() : paint2D(); }

  function paint2D() {
    if (!S.built) return;
    const ctx = cv.getContext('2d');
    const dpr = self.devicePixelRatio || 1;
    const W = cv.clientWidth, H = cv.clientHeight;
    if (!W || !H) return;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    cam = buildCam(W, H);
    R().board(ctx, cam, S.built, overlay());
    drawGrowHandles2D(ctx);
  }

  // ── 3D preview / editing surface ─────────────────────────────────────────
  // Lazily created on first switch to 3D — no need to pay for a WebGL
  // context or a Three.js scene on every editor load when 2D is still the
  // default. Once created it's kept alive (not disposed) for the rest of the
  // session; only the render loop and canvas visibility toggle with mode.
  let _r3d = null, _r3dRaf = null;
  // Carries the camera/orbit-target pose across a reset3D()-forced rebuild
  // (see reset3D()'s own comment) so an edit doesn't snap the view back to
  // the default overview out from under whoever's orbiting the board. Only
  // ever read once, by the very next ensure3D() — cleared there so a scene
  // that outlives the edit that triggered it doesn't keep re-applying a now
  // long-stale pose.
  let _camPose = null;

  function ensure3D() {
    if (_r3d) return _r3d;
    // Nothing to build yet — the mode toggle can fire before the initial
    // loadMap() resolves (e.g. restoring a saved '3d' preference at boot,
    // before the user is even confirmed signed in). paint3D() re-calls this
    // once S.built exists, so there's nothing to do here but wait.
    if (!S.built) return null;
    // board-render-3d.js loads as an ES module (see the <script type="module">
    // above) so it can pull in three/OrbitControls from the CDN — that fetch
    // is async and races boot()'s same-origin auth/map fetches. On a returning
    // user with '3d' saved as their render-mode preference, boot() can win
    // that race, so self.FPRender3D isn't set yet here. Wait for the
    // 'fp-render-3d-ready' event fired once the module finishes loading
    // instead of crashing on self.FPRender3D.create.
    if (!self.FPRender3D) return null;
    // selectionLock: false — every click here inspects a tile (even open
    // water counts as a "selection"), so the game's lock-camera-on-select
    // behaviour would otherwise engage almost constantly and fight free
    // navigation while authoring a board. gridLabels: true draws column-
    // letter/row-number axis labels along the board's two edges (A, B, C… /
    // 1, 2, 3…) so a GM can reference a tile by grid coordinate; game.html
    // doesn't need this during a match. labelOrigin keeps those labels
    // pointing at the same tile even after a later low-edge grow shifts that
    // tile's internal position — see addTerritory()'s own comment on why.
    // camera restores whatever pose reset3D() saved off the scene this one's
    // replacing, if any. See board-render-3d.js's create().
    _r3d = self.FPRender3D.create(cv3d, S.built, {
      selectionLock: false, gridLabels: true, camera: _camPose,
      labelOrigin: S.def.labelOrigin || { c: 0, r: 0 },
    });
    _camPose = null;
    syncGrowHandles3D();
    return _r3d;
  }

  // ── grid-growth handles (3D) ─────────────────────────────────────────────
  // Same concept as growHandles()'s 2D draw/hit-test above, built directly
  // into the live 3D scene (exposed as r3d.scene) instead of piggybacking on
  // board-render-3d.js — that module is shared with game.html, which has no
  // use for grid-growth UI, so this stays entirely editor-side. Rebuilt
  // wherever the scene itself is (ensure3D() on create, reset3D() on
  // teardown) since a handle's position/eligibility is derived from the same
  // S.built the rest of the scene is baked from.
  let _growMeshes = []; // [{ sc, sr, mesh, edges, label }]

  let _growTok3D = null;
  function growTokens3D() {
    if (_growTok3D) return _growTok3D;
    const read = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    // Same two parse shapes board-render-3d.js's own tokens() already uses
    // (a bare #rrggbb vs. an rgba() string) — duplicated here in miniature
    // rather than exporting them from that module for one editor-only use.
    const toHex = (v, fb) => { const m = /^#([0-9a-f]{6})$/i.exec((v || '').trim()); return m ? parseInt(m[1], 16) : fb; };
    const toHexRgba = (v, fb) => { const m = /^rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i.exec((v || '').trim()); return m ? (parseInt(m[1], 10) << 16 | parseInt(m[2], 10) << 8 | parseInt(m[3], 10)) : fb; };
    _growTok3D = {
      fill: toHex(read('--sl-ink-500'), 0x252f36),
      edge: toHexRgba(read('--sl-seam-signal'), 0xffffff),
    };
    return _growTok3D;
  }

  function syncGrowHandles3D() {
    if (!_r3d || !self.THREE) return;
    const THREE = self.THREE;
    for (const g of _growMeshes) {
      _r3d.scene.remove(g.mesh); g.mesh.geometry.dispose(); g.mesh.material.dispose();
      _r3d.scene.remove(g.edges); g.edges.geometry.dispose(); g.edges.material.dispose();
      _r3d.scene.remove(g.label);
    }
    _growMeshes = [];
    const gt = growTokens3D();
    for (const g of growHandles()) {
      const geo = new THREE.BoxGeometry(g.w, 0.05, g.h);
      const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: gt.fill, roughness: 0.9 }));
      mesh.position.set(g.c0 + g.w / 2, 0.025, g.r0 + g.h / 2);
      _r3d.scene.add(mesh);
      const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: gt.edge }));
      edges.position.copy(mesh.position);
      _r3d.scene.add(edges);
      const labelEl = document.createElement('div');
      labelEl.className = 'fp3d-growplus';
      labelEl.textContent = '+';
      const label = new self.CSS2DObject(labelEl);
      label.center.set(0.5, 0.5);
      label.position.set(g.c0 + g.w / 2, 0.12, g.r0 + g.h / 2);
      _r3d.scene.add(label);
      _growMeshes.push({ sc: g.sc, sr: g.sr, mesh, edges, label });
    }
  }

  // Screen px (cv3d-relative) -> the { sc, sr } of the grow handle sitting
  // under the point, or null — a small raycast of its own against just the
  // handle meshes, checked before r3d.tileAtAny() the same way
  // growHandleAt2D() is checked before the 2D path's tileAtAny(), since a
  // handle can sit outside the board bounds r3d.tileAtAny() itself stays
  // correctly bounded to (or even at a negative slot coordinate).
  function growHandleAt3D(mx, my) {
    if (!_r3d || !self.THREE || !_growMeshes.length) return null;
    const THREE = self.THREE;
    const rect = cv3d.getBoundingClientRect();
    const ndc = new THREE.Vector2((mx / rect.width) * 2 - 1, -(my / rect.height) * 2 + 1);
    const ray = new THREE.Raycaster();
    ray.setFromCamera(ndc, _r3d.camera);
    const hits = ray.intersectObjects(_growMeshes.map(g => g.mesh));
    if (!hits.length) return null;
    const hit = _growMeshes.find(g => g.mesh === hits[0].object);
    return hit ? { sc: hit.sc, sr: hit.sr } : null;
  }

  self.addEventListener('fp-render-3d-ready', () => { if (S.renderMode === '3d') paint3D(); });

  function paint3D() {
    if (!S.built) return;
    const r3d = ensure3D();
    if (!r3d) return; // still waiting on S.built or the board-render-3d.js module — see ensure3D()
    r3d.update(overlay());
    r3d.renderer.render(r3d.scene, r3d.camera);
    r3d.cssRenderer.render(r3d.scene, r3d.camera);
  }

  function r3dLoop() {
    _r3dRaf = requestAnimationFrame(r3dLoop);
    if (!_r3d) return;
    _r3d.controls.update();
    paint3D();
  }

  /** A board swap (reload, or a future board switcher), or any edit that
   *  changes which tiles are land vs. water (add/remove sector, resize),
   *  invalidates the whole 3D scene — land/water instance counts, city
   *  meshes, everything in it is sized to the *previous* board. Rebuilding
   *  from scratch is simpler and cheap enough (editor-only, not the live
   *  match loop) rather than trying to resize an InstancedMesh in place.
   *
   *  Saves the outgoing scene's camera position/orbit-target first so the
   *  next ensure3D() can hand it straight back to create() — without this,
   *  every edit would recreate the camera at its default overview framing
   *  and visibly snap the view out from under whoever's mid-orbit. */
  function reset3D() {
    if (!_r3d) return;
    _camPose = { position: _r3d.camera.position.clone(), target: _r3d.controls.target.clone() };
    _r3d.dispose();
    _r3d = null;
    // The disposed scene (and everything syncGrowHandles3D() added to it)
    // goes with it — drop the stale refs so a leftover mesh can't be hit-
    // tested or double-removed; the next ensure3D() rebuilds these fresh.
    _growMeshes = [];
  }

  function setRenderMode(mode) {
    // No early-out on "already this mode" — every branch below is idempotent,
    // and the initial sync call at boot relies on that to apply button state
    // and canvas visibility for a mode restored from localStorage.
    S.renderMode = mode;
    try { self.localStorage.setItem('sl_render_mode', mode); } catch (_) {}
    cv.style.display = mode === '3d' ? 'none' : 'block';
    cv3d.style.display = mode === '3d' ? 'block' : 'none';
    // The CSS2DRenderer's DOM layer (garrison/grid-ref labels) is a separate
    // element appended next to cv3d, not part of it — cv3d's own display
    // toggle above doesn't touch it. Missing this left every 3D label
    // visibly overlaid on top of the 2D canvas after switching back to 2D
    // (harmless-looking before this session added real CSS for these labels,
    // since unstyled text was nearly invisible — see docs/RENDERING.md).
    // game.html never hits this: its 2D/3D choice is a fixed page-load
    // ?render= param, not a runtime toggle.
    if (_r3d) _r3d.cssRenderer.domElement.style.display = mode === '3d' ? 'block' : 'none';
    mode2dBtn.className = 'btn' + (mode === '2d' ? ' on' : '');
    mode3dBtn.className = 'btn' + (mode === '3d' ? ' on' : '');
    if (mode === '3d') {
      ensure3D();
      resize3D();
      if (!_r3dRaf) r3dLoop();
    } else if (_r3dRaf) {
      cancelAnimationFrame(_r3dRaf);
      _r3dRaf = null;
    }
    paint();
  }
  mode2dBtn.addEventListener('click', () => setRenderMode('2d'));
  mode3dBtn.addEventListener('click', () => setRenderMode('3d'));
  setRenderMode(S.renderMode); // sync button state + canvas visibility to the restored preference

  function resize3D() { if (_r3d) _r3d.resize(); }

  window.addEventListener('resize', () => { paint(); resize3D(); });
  new ResizeObserver(() => { paint(); resize3D(); }).observe(document.getElementById('canvasWrap'));

  // ── hit testing (2D) ──────────────────────────────────────────────────────
  // Unfiltered — bounds-checked against the grid only, not against whether
  // the tile is actually claimed by a territory. The editor needs this to
  // hit-test an empty slot (to offer "place a territory here"); the game
  // client has no such need and keeps its own territory-filtered hit test.
  function tileAtAny(mx, my) {
    if (!cam || !S.built) return null;
    const u = cam.unproject(mx, my);
    const c = Math.floor(u.c), r = Math.floor(u.r);
    if (c < 0 || r < 0 || c >= S.built.gridW || r >= S.built.gridH) return null;
    return { c, r };
  }

  function cityAtTile(c, r) {
    return S.built.cities.find(city => Math.floor(city.tc) === c && Math.floor(city.tr) === r) || null;
  }
  function structureAtTile(c, r) { return S.built.structureAt(c, r); }

  // ── pointer: click-select vs drag-pan ────────────────────────────────────
  let downAt = null, panning = false, startPan = null;
  cv.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    downAt = { x: e.clientX, y: e.clientY };
    startPan = { x: S.cam.panX, y: S.cam.panY };
    panning = false;
  });
  window.addEventListener('mousemove', e => {
    if (!downAt) return;
    const dx = e.clientX - downAt.x, dy = e.clientY - downAt.y;
    if (!panning && Math.hypot(dx, dy) > 4) panning = true;
    if (panning) { S.cam.panX = startPan.x + dx; S.cam.panY = startPan.y + dy; paint(); }
  });
  window.addEventListener('mouseup', e => {
    if (!downAt) return;
    if (!panning) {
      const b = cv.getBoundingClientRect();
      onClick(e.clientX - b.left, e.clientY - b.top);
    }
    downAt = null; panning = false;
  });
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const f = Math.exp(-e.deltaY * 0.001);
    S.cam.zoom = Math.max(0.4, Math.min(3, S.cam.zoom * f));
    paint();
  }, { passive: false });

  /** Whether — and as which seat — a structure (industry/barracks) may be
   *  placed on tile t. Returns the seat to author it with, or null if not:
   *  no territory here, the territory's own capital tile (already occupied),
   *  a city or another structure already stands here, or this tile isn't
   *  actually owned by a seat at kickoff (FPMap.seedOwners, from map.starts)
   *  — placing one there would just be silently skipped by sim.create(). */
  function canPlaceStructure(prov, t) {
    if (!prov) return null;
    const [cc, cr] = F().centreTile(S.built, prov);
    if (t.c === cc && t.r === cr) return null;
    if (cityAtTile(t.c, t.r) || structureAtTile(t.c, t.r)) return null;
    const owners = F().seedOwners(S.built);
    const seat = owners[F().tileKey(t.c, t.r)];
    return (seat === 0 || seat === 1) ? seat : null;
  }

  // Shared by both renderers' click handling — only how a screen point turns
  // into a tile differs (the 2D camera's unproject() vs. the 3D renderer's
  // own ray/ground-plane tileAtAny()). Preserves the existing behaviour of
  // doing nothing at all on a click truly off the board (outside the slot
  // grid entirely), rather than clearing the current selection.
  function onClickTile(t) {
    if (!t) return;
    if (S.placeMode) {
      const prov = F().territoryAt(S.built, t.c, t.r);
      if (S.placeMode === 'city' && prov && !cityAtTile(t.c, t.r) && !structureAtTile(t.c, t.r)) {
        addCity(prov, t.c - prov.c0, t.r - prov.r0); return;
      }
      if (S.placeMode === 'industry' || S.placeMode === 'barracks') {
        const seat = canPlaceStructure(prov, t);
        if (seat !== null) { addStructure(S.placeMode, prov, t, seat); return; }
      }
      // Not a valid target for the active tool — fall through to a normal
      // tile inspect below, same as clicking with no tool active at all.
    }
    select({ kind: 'tile', c: t.c, r: t.r });
  }
  // Grow-handle hit-test runs first — a handle's tile-space rect sits just
  // outside the board bounds tileAtAny() itself is (correctly) bounded to,
  // so there's no overlap to arbitrate between the two.
  function onClick(mx, my) {
    const g = growHandleAt2D(mx, my);
    if (g) { addTerritory(g.sc, g.sr); return; }
    onClickTile(tileAtAny(mx, my));
  }

  // 3D canvas: OrbitControls owns drag-to-orbit/pan/zoom on cv3d directly, so
  // the only thing needed here is click-to-select — a genuine click (no
  // meaningful pointer movement between down and up) still fires a native
  // `click` event normally alongside whatever OrbitControls did with the same
  // gesture, so no manual drag-distance bookkeeping is needed the way the 2D
  // pan handling above needs it.
  cv3d.addEventListener('click', e => {
    if (!_r3d) return;
    const b = cv3d.getBoundingClientRect();
    const mx = e.clientX - b.left, my = e.clientY - b.top;
    const g = growHandleAt3D(mx, my);
    if (g) { addTerritory(g.sc, g.sr); return; }
    onClickTile(_r3d.tileAtAny(mx, my));
  });

  // confirmRemove reset on every navigation (including re-selecting the same
  // province later) — an armed "confirm remove" is only ever live for the
  // uninterrupted panel render cycle that armed it, never left lying around
  // for a future, unrelated click to land on by surprise.
  function select(sel) { S.sel = sel; S.confirmRemove = null; S.confirmClearBoard = false; renderPanel(); paint(); }

  // ── edits ──────────────────────────────────────────────────────────────
  function markDirty() { S.dirty = true; saveStatus.textContent = 'Unsaved changes'; saveStatus.className = ''; }

  function findCityDef(id) { return S.def.cities.find(c => c.id === id); }
  function findProvDef(id) { return S.def.provinces.find(p => p.id === id); }
  function findStructureDef(id) { return (S.def.structures || []).find(s => s.id === id); }

  // Unnamed on creation (no fantasy-name pool) — see clearBoard()'s comment.
  function addCity(prov, lc, lr) {
    const existingIds = S.def.cities.map(c => c.id);
    lc = Math.max(0, Math.min(prov.w - 1, Math.round(lc)));
    lr = Math.max(0, Math.min(prov.h - 1, Math.round(lr)));
    const id = F().pickId('city' + (prov.c0 + lc) + '_' + (prov.r0 + lr), existingIds);
    S.def.cities.push({ id, name: '', prov: prov.id, lc, lr, wealth: 2.4, garrison: 34 });
    S.placeMode = null;
    markDirty();
    rebuild();
    select({ kind: 'tile', c: prov.c0 + lc, r: prov.r0 + lr });
  }

  function deleteCity(id) {
    S.def.cities = S.def.cities.filter(c => c.id !== id);
    markDirty();
    select(null);
    rebuild();
  }

  /** Toggle whether a city is its sector's capital — see map.js's
   *  capitalOf() for what this actually means now (income only; the city's
   *  board position is irrelevant). Turning one on steals the flag from any
   *  other city in the same sector first, since at most one may hold it;
   *  turning the current capital off just leaves the sector capital-less
   *  until another city is marked (surfaced by the Capitals panel/save
   *  check, not blocked here — an editing board is allowed to be briefly
   *  incomplete). */
  function toggleCapital(id) {
    const c = findCityDef(id);
    if (!c) return;
    if (c.capital) {
      delete c.capital;
    } else {
      for (const other of S.def.cities) if (other.prov === c.prov) delete other.capital;
      c.capital = true;
    }
    markDirty();
    rebuild();
  }

  function mirrorCity(id) {
    const built = S.built.city(id);
    if (!built || !built.twin) return;
    const src = findCityDef(id), dst = findCityDef(built.twin);
    if (!src || !dst) return;
    dst.wealth = src.wealth;
    if (src.seat === undefined || src.seat === null) {
      delete dst.seat;
      dst.garrison = src.garrison;
    } else {
      dst.seat = 1 - src.seat;
      delete dst.garrison;
    }
    // Capital status mirrors too — same one-per-sector rule as toggleCapital(),
    // applied to the twin's own sector rather than the source's.
    if (src.capital) {
      for (const other of S.def.cities) if (other.prov === dst.prov) delete other.capital;
      dst.capital = true;
    } else {
      delete dst.capital;
    }
    markDirty();
    rebuild();
  }

  /** Place a starting structure (industry/barracks — see FPMap.AUTHORABLE_KINDS)
   *  at tile t, owned by seat (already validated by canPlaceStructure()). */
  function addStructure(kind, prov, t, seat) {
    if (!S.def.structures) S.def.structures = [];
    const existingIds = S.def.structures.map(s => s.id);
    const id = F().pickId(kind + '-' + prov.id, existingIds);
    S.def.structures.push({ id, prov: prov.id, lc: t.c - prov.c0, lr: t.r - prov.r0, kind, seat });
    S.placeMode = null;
    markDirty();
    rebuild();
    select({ kind: 'tile', c: t.c, r: t.r });
  }

  function deleteStructure(id) {
    S.def.structures = (S.def.structures || []).filter(s => s.id !== id);
    markDirty();
    select(null);
    rebuild();
  }

  /** Create the matching structure in the twin province, if the board has
   *  one and it isn't already mirrored — there's no stat to copy (a
   *  structure is just kind + seat, and seat is fixed by tile position), so
   *  "mirror" here means "make sure one exists," not "copy values over." */
  function mirrorStructure(id) {
    const built = S.built.structure(id);
    const src = findStructureDef(id);
    if (!built || !src || built.twin) return;
    const p = S.built.province(src.prov);
    if (!p || !p.twin) return;
    const m = F().mirrorLocal(S.built.block, src.lc, src.lr);
    const existingIds = (S.def.structures || []).map(s => s.id);
    const id2 = F().pickId(src.kind + '-' + p.twin, existingIds);
    S.def.structures.push({ id: id2, prov: p.twin, lc: m.lc, lr: m.lr, kind: src.kind, seat: 1 - src.seat });
    markDirty();
    rebuild();
  }

  /** Place a new sector at slot (sc, sr) — grown into from an empty tile
   *  click, or from a grow-handle click (see growHandles()), which is why
   *  this also owns growing (and, on the low edge, shifting) the slot grid
   *  to fit the target slot rather than assuming it's already in bounds:
   *  slot coordinates are always non-negative (docs/MAP_SYSTEM.md), so
   *  growing "left" or "up" means every existing province's sc/sr moves over
   *  by however far negative the new slot would otherwise be, the same way
   *  resizeSlots() already grows (without shifting) on the high edge. A
   *  grow-handle click is always pre-validated by growHandles() itself to
   *  stay under MAX_SLOTS; clamping here too is just so a direct call (e.g.
   *  the manual "click open water" tile-inspector path, which only ever
   *  passes an already-in-bounds slot) can't be talked into exceeding it.
   *
   *  Every sector needs a capital to actually be fought over and pay income
   *  (see docs/MECHANICS.md), so this seeds one — flagged capital: true (see
   *  map.js's capitalOf(); the flag is what makes it the capital, not where
   *  it sits) — at the centre tile as a sane starting spot, with modest
   *  neutral defaults, editable afterward exactly like any other city,
   *  freely movable without losing capital status. Both the sector and its
   *  capital are left unnamed (no fantasy-name pool) — the GM names their
   *  own world; see clearBoard()'s own comment for the same reasoning. */
  function addTerritory(sc, sr) {
    if (S.def.provinces.some(p => p.sc === sc && p.sr === sr)) return; // already occupied

    const block = S.def.block || F().DEFAULT_BLOCK;
    const cur = S.def.slots || F().DEFAULT_SLOTS;
    let cols = cur.cols, rows = cur.rows, shiftC = 0, shiftR = 0;
    if (sc < 0) { shiftC = -sc; cols += shiftC; sc = 0; }
    else if (sc >= cols) cols = sc + 1;
    if (sr < 0) { shiftR = -sr; rows += shiftR; sr = 0; }
    else if (sr >= rows) rows = sr + 1;
    cols = Math.min(MAX_SLOTS, cols);
    rows = Math.min(MAX_SLOTS, rows);
    if (shiftC || shiftR) {
      for (const p of S.def.provinces) { p.sc += shiftC; p.sr += shiftR; }
      // The 3D grid-reference labels (docs/RENDERING.md) are meant as a
      // stable address a GM can write down — "the barracks are at C,4" —
      // that shouldn't quietly point at a different tile the next time the
      // board grows from this side. A low-edge grow moves every existing
      // tile's *internal* position by shiftC/shiftR sectors' worth of
      // tiles, so labelOrigin absorbs exactly that much, keeping every
      // already-labelled tile's displayed row/column unchanged — only the
      // newly-grown tiles pick up the negative-going labels instead. See
      // syncGrowHandles3D()/ensure3D() for where this gets read back out.
      const lo = S.def.labelOrigin || { c: 0, r: 0 };
      S.def.labelOrigin = { c: lo.c + shiftC * block.w, r: lo.r + shiftR * block.h };
    }
    S.def.slots = { cols, rows };

    const existingIds = S.def.provinces.map(p => p.id);
    const id = F().pickId('sector' + sc + sr, existingIds);
    S.def.provinces.push({ id, name: '', sc, sr });

    const clc = (block.w - 1) >> 1, clr = (block.h - 1) >> 1;
    const cIds = S.def.cities.map(c => c.id);
    const cid = F().pickId('capital' + sc + sr, cIds);
    S.def.cities.push({ id: cid, name: '', prov: id, lc: clc, lr: clr, wealth: 2.4, garrison: 30, capital: true });

    markDirty();
    reset3D(); // adding a territory changes which tiles are land vs. water — the 3D scene's instance layout is baked in at create() and can't be patched in place, see reset3D()'s own comment
    rebuild();
    select({ kind: 'tile', c: sc * block.w + clc, r: sr * block.h + clr });
  }

  function removeTerritory(id) {
    S.def.cities = S.def.cities.filter(c => c.prov !== id);
    S.def.structures = (S.def.structures || []).filter(s => s.prov !== id);
    S.def.provinces = S.def.provinces.filter(p => p.id !== id);
    markDirty();
    // reset3D() only *invalidates* the scene — the next paint() lazily
    // recreates it from S.built (see ensure3D()). rebuild() must run first
    // to refresh S.built from the trimmed S.def; calling select() (which
    // also paints) before rebuild() would let ensure3D() eagerly rebuild
    // the scene from the still-stale S.built, and rebuild()'s own paint
    // right after would then find _r3d already set and skip rebuilding —
    // leaving the removed sector's land/grid permanently stuck in 3D.
    reset3D(); // same reasoning as addTerritory — the freed slot becomes water
    rebuild();
    select(null);
  }

  /** Wipe every city and structure, and blank every sector's name, but keep
   *  the sectors/grid themselves — restarts authoring from a clean slate
   *  without rebuilding the board's shape. The GM (this editor's whole
   *  premise — see docs/EDITOR_UPGRADE.md) names their own world; a leftover
   *  fantasy name from a previous scenario is as much stale content as a
   *  leftover city would be. Leaves every sector capital-less and nameless
   *  until re-authored — an expected, if incomplete, mid-edit state, same as
   *  removeTerritory() briefly leaving a freed slot. Doesn't touch land/water
   *  layout, so no reset3D() is needed (mirrors deleteCity()/deleteStructure()). */
  function clearBoard() {
    S.def.cities = [];
    S.def.structures = [];
    for (const p of S.def.provinces) p.name = '';
    markDirty();
    select(null);
    rebuild();
  }

  /** Grow or shrink the board's slot grid. Growing only ever adds empty
   *  (water) slots, so it's safe unconditionally. Shrinking is refused
   *  outright — rather than silently deleting content — if it would orphan a
   *  territory currently sitting outside the new bounds; remove or relocate
   *  it first. Clamped to a sane range so a typo can't hand the renderer an
   *  unreasonably huge grid. */
  function resizeSlots(cols, rows) {
    cols = Math.max(1, Math.min(MAX_SLOTS, Math.round(cols) || 1));
    rows = Math.max(1, Math.min(MAX_SLOTS, Math.round(rows) || 1));
    const orphan = S.def.provinces.find(p => p.sc >= cols || p.sr >= rows);
    if (orphan) {
      // Inline, not alert() — a native dialog here is off-style (see the
      // remove-territory comment above) and was actually hit and fixed
      // during development: it silently froze the whole page to any further
      // input, browser-automation or human, with no way out but closing the
      // tab.
      S.boardError = 'Can’t shrink to ' + cols + '×' + rows + ' — ' + (orphan.name || orphan.id) +
        ' sits at slot (' + orphan.sc + ', ' + orphan.sr + '), outside the new grid. Remove it first.';
      renderPanel(); // discard the typed value, redisplay the actual current size (+ the error)
      return;
    }
    S.boardError = null;
    S.def.slots = { cols, rows };
    markDirty();
    reset3D();
    rebuild();
  }

  /** Grow or shrink every sector's tile footprint (the board's single global
   *  `block` field — sector size is uniform across the whole board, there's
   *  no per-sector override). Same shrink-refusal philosophy as resizeSlots():
   *  refuse rather than silently strand a city or structure whose lc/lr
   *  would fall outside the new footprint. Note this does NOT reposition
   *  anything that survives the check — a sector's centre tile (the tile a
   *  military capture targets, see centreTile()) moves when block.w/h
   *  changes, so a structure sitting under the old footprint may no longer
   *  sit exactly on the new centre. A capital city is unaffected either way
   *  — capitalOf() no longer cares where in the sector it sits (see its own
   *  comment) — this only matters for a pre-placed structure that was
   *  deliberately positioned on the old centre tile specifically. */
  function resizeBlock(w, h) {
    w = Math.max(1, Math.min(15, Math.round(w) || 1));
    h = Math.max(1, Math.min(15, Math.round(h) || 1));
    const orphanCity = S.def.cities.find(c => c.lc >= w || c.lr >= h);
    const orphanStruct = (S.def.structures || []).find(s => s.lc >= w || s.lr >= h);
    const orphan = orphanCity || orphanStruct;
    if (orphan) {
      S.boardError = 'Can’t shrink sectors to ' + w + '×' + h + ' — ' + (orphan.name || orphan.id) +
        ' sits at local (' + orphan.lc + ', ' + orphan.lr + '), outside the new footprint. Clear or reposition it first.';
      renderPanel();
      return;
    }
    S.boardError = null;
    S.def.block = { w, h };
    markDirty();
    reset3D(); // sector footprint changes which tiles are land vs. water — same reasoning as addTerritory()
    rebuild();
  }

  /** Assign (or clear) which seat a whole sector starts owned by — edits the
   *  board's `starts` list (see docs/MAP_SYSTEM.md), which is what actually
   *  seeds every tile in the sector to that seat at kickoff
   *  (FPMap.seedOwners() — see overlay()'s own comment for why the editor's
   *  preview now reads this instead of individual cities' `seat` fields).
   *
   *  Capped at one owned sector per seat — a seat only ever has one starting
   *  home, so assigning a sector to a seat that already owns a different one
   *  moves the assignment rather than creating a second home; both `starts`
   *  and the displaced sector's own capital (if it has one) are updated
   *  together so nothing is left silently claiming a seat it no longer owns.
   *
   *  Also keeps a sector's own capital in step: a capital whose own `seat`
   *  disagreed with the tiles under it would be a self-contradictory board
   *  (sim.create() already refuses exactly this mismatch for a pre-placed
   *  structure — see MAP_SYSTEM.md's Structure section — capitals just never
   *  had a UI path to create the same contradiction before this control
   *  existed). This is bookkeeping for the data's own consistency, not what
   *  makes ownership real — sim.create() never reads a city's `seat` field. */
  function setStartingSeat(provId, seat) {
    const syncCapital = (id, seatOrNull) => {
      const p = S.built.province(id);
      const cap = p && F().capitalOf(S.built, p);
      const c = cap && findCityDef(cap.id);
      if (!c) return;
      if (seatOrNull === 0 || seatOrNull === 1) { c.seat = seatOrNull; delete c.garrison; }
      else { delete c.seat; if (c.garrison == null) c.garrison = 30; }
    };
    S.def.starts = (S.def.starts || []).filter(s => s.territory !== provId);
    if (seat === 0 || seat === 1) {
      // Cap of one: whichever sector previously owned this seat gives it up.
      const displaced = S.def.starts.filter(s => s.seat === seat);
      S.def.starts = S.def.starts.filter(s => s.seat !== seat);
      S.def.starts.push({ seat, territory: provId });
      for (const d of displaced) syncCapital(d.territory, null);
    }
    syncCapital(provId, seat);
    markDirty();
    rebuild();
  }

  // ── tile inspector ────────────────────────────────────────────────────
  // Every click resolves here — a city, a structure, open ground inside a
  // territory, or open water all render through this one function, so a tile
  // is inspected the same way no matter what (if anything) is on it.
  /** The "Remove sector" control, shared across every tileInspector() branch
   *  that has a province under the clicked tile — a city or structure sitting
   *  on the sector's land is still part of that sector, so removing it needs
   *  to be reachable no matter which specific tile inside it is selected, not
   *  only "open ground." Reuses the same two-click-confirm arming
   *  (S.confirmRemove) the open-ground case already had; wirePanel()'s
   *  #removeTerritoryBtn handler already re-derives the province from the
   *  live selection rather than trusting a closed-over value, so rendering
   *  this same button id in more branches needed no wiring change at all. */
  function removeSectorControl(prov) {
    const armed = S.confirmRemove === prov.id;
    const n = prov.cities.length;
    return '<div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--sl-seam);">' +
      '<button class="btn danger' + (armed ? ' on' : '') + '" id="removeTerritoryBtn" style="width:100%;">' +
      (armed ? 'Confirm — ' + n + (n === 1 ? ' city' : ' cities') + ' removed' : 'Remove sector') +
      '</button></div>';
  }

  function tileInspector(c, r) {
    const coord = '<span class="mono">(' + c + ', ' + r + ')</span>';
    const prov = F().territoryAt(S.built, c, r);
    const city = cityAtTile(c, r);
    const structure = structureAtTile(c, r);

    if (city) {
      const isNeutral = city.seat === undefined || city.seat === null;
      return '<div><div class="section-title">City' + (city.name ? ' — ' + escapeHtml(city.name) : '') + ' ' + coord + '</div>' +
        field('Name', 'text', 'name', city.name, null, 'Unnamed — click to set') +
        '<div class="row2">' + field('Col (lc)', 'number', 'lc', city.lc) + field('Row (lr)', 'number', 'lr', city.lr) + '</div>' +
        fieldSelect('seat', isNeutral ? 'neutral' : String(city.seat), [
          ['neutral', 'Neutral'], ['0', 'Seat 1'], ['1', 'Seat 2'],
        ]) +
        field('Wealth', 'number', 'wealth', city.wealth, '0.1') +
        (isNeutral ? field('Garrison', 'number', 'garrison', city.garrison || 0) : '') +
        '<button class="btn' + (city.capital ? ' on' : '') + '" id="capitalBtn" style="width:100%; margin-top:6px;">' +
        (city.capital ? '✓ Capital of this sector' : 'Make capital of this sector') + '</button>' +
        '<div style="font-size:12.5px;color:var(--sl-text-dim); margin-top:4px;">The capital is what pays income while held — exactly one per sector, anywhere in it. Marking this one clears the flag from any other city here.</div>' +
        '<div style="display:flex; gap:8px; margin-top:6px;">' +
        '<button class="btn" id="mirrorBtn"' + (city.twin ? '' : ' disabled') + '>Mirror to twin</button>' +
        '<button class="btn danger" id="deleteBtn">Clear tile</button>' +
        '</div>' + (prov ? removeSectorControl(prov) : '') + '</div>';
    }

    if (structure) {
      const kit = F().STRUCTURE_KIT[structure.kind];
      const canMirror = !structure.twin && !!F().territoryAt(S.built, c, r).twin;
      return '<div><div class="section-title">Structure — ' + escapeHtml(kit.label) + ' ' + coord + '</div>' +
        '<div class="field"><label>Seat</label><div class="mono" style="padding:7px 0 3px;">SEAT ' + (structure.seat + 1) + '</div></div>' +
        '<div style="font-size:12.5px;color:var(--sl-text-dim); margin-bottom:8px;">Seat is fixed by tile position — clear and re-place to move it.</div>' +
        '<div style="display:flex; gap:8px;">' +
        '<button class="btn" id="mirrorStructureBtn"' + (canMirror ? '' : ' disabled') + '>Mirror to twin</button>' +
        '<button class="btn danger" id="deleteStructureBtn">Clear tile</button>' +
        '</div>' + (prov ? removeSectorControl(prov) : '') + '</div>';
    }

    if (prov) {
      return '<div><div class="section-title">Open ground ' + coord + '</div>' +
        '<div style="font-size:12.5px;color:var(--sl-text-dim); margin-bottom:8px;">Sector: ' + (prov.name ? escapeHtml(prov.name) : '<em>unnamed — set it in the Sectors list</em>') +
        '. No structure here — use Place below, then click this tile. Starting seat is set from the Sectors list above.</div>' +
        removeSectorControl(prov) + '</div>';
    }

    return '<div><div class="section-title">Open water ' + coord + '</div>' +
      '<div style="font-size:12.5px;color:var(--sl-text-dim); margin-bottom:8px;">No sector placed here yet — choose what this ground becomes. A land sector starts neutral, with a capital at its centre.</div>' +
      '<div style="display:flex; gap:8px;">' +
      '<button class="btn primary" id="addTerritoryBtn" style="flex:1;">Add land sector</button>' +
      '<button class="btn" id="leaveWaterBtn" style="flex:1;">Leave as water</button>' +
      '</div></div>';
  }

  // ── panel rendering ───────────────────────────────────────────────────
  function renderPanel() {
    const parts = [];
    const slots = S.def.slots || F().DEFAULT_SLOTS;

    const block = S.def.block || F().DEFAULT_BLOCK;
    parts.push(
      '<div><div class="section-title">Board</div>' +
      '<div class="row2">' +
      '<div class="field"><label>Sector cols</label><input data-board-field="cols" type="number" min="1" max="12" value="' + escapeAttr(slots.cols) + '"></div>' +
      '<div class="field"><label>Sector rows</label><input data-board-field="rows" type="number" min="1" max="12" value="' + escapeAttr(slots.rows) + '"></div>' +
      '</div>' +
      '<div style="font-size:12.5px;color:var(--sl-text-dim); margin-bottom:8px;">How many sectors make up the board — or click the + beside any sector on the board to grow into it one sector at a time. Growing here (typed numbers) is the only way to shrink, and is refused if a sector would fall outside the new grid.</div>' +
      '<div class="row2">' +
      '<div class="field"><label>Sector width</label><input data-block-field="w" type="number" min="1" max="15" value="' + escapeAttr(block.w) + '"></div>' +
      '<div class="field"><label>Sector height</label><input data-block-field="h" type="number" min="1" max="15" value="' + escapeAttr(block.h) + '"></div>' +
      '</div>' +
      '<div style="font-size:12.5px;color:var(--sl-text-dim);">Tiles per sector (' + block.w + '×' + block.h + ' = ' + (block.w * block.h) + '). Shrinking is refused if it would strand an existing city or structure outside the new footprint — clear the sector first.</div>' +
      (S.boardError ? '<div class="sym-issue" style="margin-top:8px;">' + escapeHtml(S.boardError) + '</div>' : '') +
      '</div>'
    );

    parts.push('<div class="section-title">Sectors</div>');
    for (const p of S.def.provinces) {
      const startSeat = (S.def.starts || []).find(s => s.territory === p.id);
      const seatVal = startSeat ? startSeat.seat : null;
      const dotColour = seatVal === 0 ? 'var(--sl-faction-self)' : seatVal === 1 ? 'var(--sl-faction-foe)' : 'var(--sl-faction-neutral)';
      parts.push(
        '<div class="prov-row">' +
        '<span class="dot" style="background:' + dotColour + '"></span>' +
        '<input data-prov-name="' + p.id + '" value="' + escapeAttr(p.name) + '" placeholder="Unnamed sector">' +
        '<select data-prov-seat="' + p.id + '">' +
        '<option value=""' + (seatVal === null ? ' selected' : '') + '>Neutral</option>' +
        '<option value="0"' + (seatVal === 0 ? ' selected' : '') + '>Seat 1</option>' +
        '<option value="1"' + (seatVal === 1 ? ' selected' : '') + '>Seat 2</option>' +
        '</select>' +
        '</div>'
      );
    }

    if (S.sel && S.sel.kind === 'tile') {
      parts.push(tileInspector(S.sel.c, S.sel.r));
    } else {
      parts.push('<div id="emptyPanel">Click any tile to inspect it — a city, a structure, open ground inside a sector, or open water.</div>');
    }

    parts.push('<div><div class="section-title">Place</div><div style="display:flex; flex-direction:column; gap:6px;">' +
      PLACE_KINDS.map(([kind, label]) =>
        '<button class="btn' + (S.placeMode === kind ? ' on' : '') + '" data-place-kind="' + kind + '" style="width:100%;">' +
        (S.placeMode === kind ? 'Click a valid tile…' : label) + '</button>'
      ).join('') +
      '</div></div>');

    parts.push('<div><div class="section-title">Board actions</div>' +
      '<button class="btn danger' + (S.confirmClearBoard ? ' on' : '') + '" id="clearBoardBtn" style="width:100%;">' +
      (S.confirmClearBoard ? 'Confirm — all cities & structures removed' : 'Clear board (cities & structures)') +
      '</button></div>');

    parts.push('<div><div class="section-title">Capitals</div><div id="capList">' +
      (S.capitalIssues.length === 0
        ? '<div class="sym-ok">✓ Every sector has a capital</div>'
        : S.capitalIssues.map(i => '<div class="sym-issue">' + escapeHtml(i) + '</div>').join('')) +
      '</div></div>');

    parts.push('<div><div class="section-title">Symmetry</div><div id="symList">' +
      (S.symmetry.ok
        ? '<div class="sym-ok">✓ Balanced</div>'
        : S.symmetry.issues.map(i => '<div class="sym-issue">' + escapeHtml(i) + '</div>').join('')) +
      '</div></div>');

    panel.innerHTML = parts.join('');
    wirePanel();
  }

  function field(label, type, key, value, step, placeholder) {
    return '<div class="field"><label>' + label + '</label>' +
      '<input data-city-field="' + key + '" type="' + type + '" value="' + escapeAttr(value) + '"' +
      (step ? ' step="' + step + '"' : '') +
      (placeholder ? ' placeholder="' + escapeAttr(placeholder) + '"' : '') + '></div>';
  }
  function fieldSelect(key, value, options) {
    return '<div class="field"><label>Seat</label><select data-city-field="' + key + '">' +
      options.map(([v, l]) => '<option value="' + v + '"' + (v === value ? ' selected' : '') + '>' + l + '</option>').join('') +
      '</select></div>';
  }
  function escapeHtml(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
  function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }

  function wirePanel() {
    panel.querySelectorAll('[data-prov-name]').forEach(inp => {
      inp.addEventListener('change', () => {
        const p = findProvDef(inp.getAttribute('data-prov-name'));
        if (p) { p.name = inp.value; markDirty(); rebuild(); }
      });
    });

    panel.querySelectorAll('[data-board-field]').forEach(inp => {
      inp.addEventListener('change', () => {
        const slots = S.def.slots || F().DEFAULT_SLOTS;
        const cols = inp.getAttribute('data-board-field') === 'cols' ? Number(inp.value) : slots.cols;
        const rows = inp.getAttribute('data-board-field') === 'rows' ? Number(inp.value) : slots.rows;
        resizeSlots(cols, rows);
      });
    });

    panel.querySelectorAll('[data-block-field]').forEach(inp => {
      inp.addEventListener('change', () => {
        const block = S.def.block || F().DEFAULT_BLOCK;
        const w = inp.getAttribute('data-block-field') === 'w' ? Number(inp.value) : block.w;
        const h = inp.getAttribute('data-block-field') === 'h' ? Number(inp.value) : block.h;
        resizeBlock(w, h);
      });
    });

    panel.querySelectorAll('[data-prov-seat]').forEach(sel => {
      sel.addEventListener('change', () => {
        const seat = sel.value === '' ? null : Number(sel.value);
        setStartingSeat(sel.getAttribute('data-prov-seat'), seat);
      });
    });

    panel.querySelectorAll('[data-place-kind]').forEach(btn => {
      btn.addEventListener('click', () => {
        const kind = btn.getAttribute('data-place-kind');
        S.placeMode = S.placeMode === kind ? null : kind;
        renderPanel();
      });
    });

    // The tile currently selected — most handlers below act on whatever's on
    // it right now, re-derived fresh rather than cached, since an edit can
    // change what's on a tile without changing the selection itself.
    const tile = S.sel && S.sel.kind === 'tile' ? S.sel : null;
    const cityHere = tile && cityAtTile(tile.c, tile.r);
    const structureHere = tile && structureAtTile(tile.c, tile.r);

    const mirrorBtn = document.getElementById('mirrorBtn');
    if (mirrorBtn) mirrorBtn.addEventListener('click', () => cityHere && mirrorCity(cityHere.id));

    const deleteBtn = document.getElementById('deleteBtn');
    if (deleteBtn) deleteBtn.addEventListener('click', () => cityHere && deleteCity(cityHere.id));

    const capitalBtn = document.getElementById('capitalBtn');
    if (capitalBtn) capitalBtn.addEventListener('click', () => cityHere && toggleCapital(cityHere.id));

    const mirrorStructureBtn = document.getElementById('mirrorStructureBtn');
    if (mirrorStructureBtn) mirrorStructureBtn.addEventListener('click', () => structureHere && mirrorStructure(structureHere.id));

    const deleteStructureBtn = document.getElementById('deleteStructureBtn');
    if (deleteStructureBtn) deleteStructureBtn.addEventListener('click', () => structureHere && deleteStructure(structureHere.id));

    const removeTerritoryBtn = document.getElementById('removeTerritoryBtn');
    if (removeTerritoryBtn) removeTerritoryBtn.addEventListener('click', () => {
      const prov = tile && F().territoryAt(S.built, tile.c, tile.r);
      if (!prov) return;
      if (S.confirmRemove === prov.id) {
        removeTerritory(prov.id); // removeTerritory() -> select(null) already clears confirmRemove
      } else {
        S.confirmRemove = prov.id;
        renderPanel(); // arm it — a second click on the now-relabelled button actually removes
      }
    });

    const clearBoardBtn = document.getElementById('clearBoardBtn');
    if (clearBoardBtn) clearBoardBtn.addEventListener('click', () => {
      if (S.confirmClearBoard) {
        clearBoard(); // clearBoard() -> select(null) already resets confirmClearBoard
      } else {
        S.confirmClearBoard = true;
        renderPanel(); // arm it — a second click on the now-relabelled button actually clears
      }
    });

    const addTerritoryBtn = document.getElementById('addTerritoryBtn');
    if (addTerritoryBtn) addTerritoryBtn.addEventListener('click', () => {
      if (!tile) return;
      const block = S.built.block;
      addTerritory(Math.floor(tile.c / block.w), Math.floor(tile.r / block.h));
    });

    // "Leave as water" is a no-op on the definition — water is just the
    // absence of a province, never a value to set — so this only dismisses
    // the inspector back to nothing selected, the same ground state it was
    // already in.
    const leaveWaterBtn = document.getElementById('leaveWaterBtn');
    if (leaveWaterBtn) leaveWaterBtn.addEventListener('click', () => select(null));

    if (cityHere) {
      panel.querySelectorAll('[data-city-field]').forEach(inp => {
        inp.addEventListener('change', () => {
          const c = findCityDef(cityHere.id);
          if (!c) return;
          const key = inp.getAttribute('data-city-field');
          if (key === 'seat') {
            if (inp.value === 'neutral') { delete c.seat; if (c.garrison == null) c.garrison = 30; }
            else { c.seat = Number(inp.value); delete c.garrison; }
          } else if (key === 'name') {
            c.name = inp.value;
          } else if (key === 'lc' || key === 'lr') {
            c[key] = Math.max(0, Math.round(Number(inp.value) || 0));
            // Selection is by tile, not city id — follow the city to its new
            // tile (using the still-current built province geometry) so the
            // panel doesn't go on inspecting the now-vacated old tile.
            const p = S.built.province(c.prov);
            if (p) S.sel = { kind: 'tile', c: p.c0 + c.lc, r: p.r0 + c.lr };
          } else if (key === 'wealth') {
            c.wealth = Math.max(0, Number(inp.value) || 0);
          } else if (key === 'garrison') {
            c.garrison = Math.max(0, Math.round(Number(inp.value) || 0));
          }
          markDirty();
          rebuild();
        });
      });
    }
  }

  // ── save / reload ─────────────────────────────────────────────────────
  document.getElementById('saveBtn').addEventListener('click', async () => {
    if (S.saving) return;
    S.saving = true;
    saveStatus.textContent = 'Saving…'; saveStatus.className = '';
    try {
      const r = await fetch('/api/maps/' + S.key, {
        method: 'PUT', credentials: 'same-origin',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(S.def),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) {
        const issues = j.issues ? ' — ' + j.issues.join('; ') : '';
        saveStatus.textContent = (j.error || 'save failed') + issues;
        saveStatus.className = 'err';
      } else {
        S.dirty = false;
        saveStatus.textContent = 'Saved ' + new Date(j.map.updatedAt).toLocaleTimeString();
        saveStatus.className = 'ok';
      }
    } catch (_) {
      saveStatus.textContent = 'network error'; saveStatus.className = 'err';
    } finally {
      S.saving = false;
    }
  });

  document.getElementById('reloadBtn').addEventListener('click', async () => {
    if (S.dirty && !confirm('Discard unsaved changes?')) return;
    select(null);
    try { await loadMap(); } catch (err) { saveStatus.textContent = String(err.message || err); saveStatus.className = 'err'; }
  });
})();
</script>
</body>
</html>
